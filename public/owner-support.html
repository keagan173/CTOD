<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CTOD Support Console</title><link rel="stylesheet" href="/branding/ctod-owner-platform-theme.css?v=20260815-1"><style>body{margin:0;background:#090b0f;color:#f6f1e7;font-family:Inter,system-ui,sans-serif}.wrap{max-width:1200px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center}.card{background:#11151b;border:1px solid #3b321b;border-radius:18px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.kpi{background:#171b22;border:1px solid #40371e;border-radius:14px;padding:14px}.kpi small{display:block;color:#b9aa7a;text-transform:uppercase;font-size:10px;font-weight:900}.kpi b{font-size:28px}.btn{border:1px solid #8c6a18;background:#17130a;color:#f2c34d;border-radius:10px;padding:10px 13px;font-weight:850;text-decoration:none;cursor:pointer}.field{background:#0d1117;color:#f6f1e7;border:1px solid #4c4226;border-radius:10px;padding:10px;width:100%}.row{padding:11px 0;border-top:1px solid #242932}.sev{display:inline-block;border-radius:999px;padding:4px 8px;font-size:10px;font-weight:900;text-transform:uppercase}.fatal,.error{background:#421c20;color:#ff9ba1}.warning{background:#443516;color:#ffd273}.info{background:#153149;color:#8ed4ff}.muted{color:#9b9a96}.healthy{color:#64df9b}.bad{color:#ff8d94}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.top{align-items:flex-start;flex-direction:column}}@media(max-width:500px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="top"><div><div style="color:#d2aa3a;font-weight:900;letter-spacing:.12em">CTOD PLATFORM OWNER</div><h1 style="margin:.2em 0">System Health & Support</h1><div class="muted">Customer workspace runtime telemetry without customer impersonation.</div></div><div><a class="btn" href="/owner">Owner Console</a></div></div><section class="card"><div class="top"><div><h2 style="margin:0">Runtime Health</h2><div id="msg" class="muted">Checking owner session...</div></div><button id="refresh" class="btn">Refresh</button></div><div id="kpis" class="grid" style="margin-top:14px"></div></section><section class="card"><div class="top"><div><h2 style="margin:0">Customer Health</h2><div class="muted">Last 24 hours of browser-side runtime signals.</div></div><select id="company" class="field" style="max-width:300px"><option value="">All customers</option></select></div><div id="health"></div></section><section class="card"><h2>Recent Runtime Events</h2><div id="events"></div></section></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2.112.2';const sb=createClient('https://wezcuprboyvbmlnuqdoi.supabase.co','sb_publishable_BFhSdHnbppOmw98ons8iSw_MtkOnRg5'),$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));async function load(){try{const{data:{user}}=await sb.auth.getUser();if(!user)throw new Error('Sign in through the Owner Console first.');const aal=await sb.auth.mfa.getAuthenticatorAssuranceLevel();if(aal.error||aal.data.currentLevel!=='aal2')throw new Error('Owner MFA verification is required.');$('#msg').textContent='Loading support telemetry...';const company=$('#company').value||null;const{data,error}=await sb.rpc('operator_service_runtime_health',{p_actor_user_id:user.id,p_company_id:company});if(error)throw error;const health=data.health||[],events=data.events||[];const errors=health.reduce((n,x)=>n+Number(x.errors_24h||0),0),fatals=health.reduce((n,x)=>n+Number(x.fatals_24h||0),0),active=health.filter(x=>Number(x.events_24h||0)>0).length;$('#kpis').innerHTML=`<div class="kpi"><small>Customers reporting</small><b>${active}</b></div><div class="kpi"><small>Errors · 24h</small><b class="${errors?'bad':'healthy'}">${errors}</b></div><div class="kpi"><small>Fatal stalls · 24h</small><b class="${fatals?'bad':'healthy'}">${fatals}</b></div><div class="kpi"><small>Last refresh</small><b style="font-size:16px">${new Date(data.generated_at).toLocaleTimeString()}</b></div>`;if($('#company').options.length===1){health.forEach(h=>$('#company').insertAdjacentHTML('beforeend',`<option value="${esc(h.company_id)}">${esc(h.company_name)}</option>`))}$('#health').innerHTML=health.map(h=>`<div class="row"><b>${esc(h.company_name)}</b> <span class="${Number(h.errors_24h)>0?'bad':'healthy'}">${Number(h.errors_24h)>0?'Needs attention':'Healthy'}</span><div class="muted">${esc(h.events_24h)} events · ${esc(h.errors_24h)} errors · ${esc(h.fatals_24h)} fatal stalls · last error ${h.last_error_at?new Date(h.last_error_at).toLocaleString():'none'}</div></div>`).join('')||'<div class="muted">No customer telemetry yet.</div>';$('#events').innerHTML=events.map(e=>`<div class="row"><span class="sev ${esc(e.severity)}">${esc(e.severity)}</span> <b>${esc(e.company_name||'Unknown customer')}</b>${e.location_code?' · LOC'+esc(e.location_code):''}<div>${esc(e.message)}</div><div class="muted">${esc(e.event_type)} · ${esc(e.module||'browser')} · ${esc(e.release_version||'unknown release')} · ${new Date(e.occurred_at).toLocaleString()}</div></div>`).join('')||'<div class="muted">No runtime errors have been reported.</div>';$('#msg').textContent='Owner telemetry online.'}catch(e){$('#msg').textContent=e.message;$('#health').innerHTML='<div class="bad">'+esc(e.message)+'</div>'}}$('#refresh').onclick=load;$('#company').onchange=load;load();</script></body></html>
