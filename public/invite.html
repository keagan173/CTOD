<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accept CTOD Invitation</title><style>body{font-family:Inter,system-ui,sans-serif;background:#f4f7fb;color:#172033;margin:0}.wrap{max-width:680px;margin:40px auto;padding:20px}.card{background:#fff;border:1px solid #dbe3ee;border-radius:18px;padding:24px}.field{width:100%;padding:12px;border:1px solid #cbd6e3;border-radius:10px;margin:6px 0;box-sizing:border-box}.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:800;cursor:pointer;background:#153f73;color:#fff}.muted{color:#6b7280}.good{color:#18794e;font-weight:700}.hidden{display:none}</style></head><body><div class="wrap"><h1>CTOD Invitation</h1><section class="card"><div id="status">Checking invitation…</div><div id="login" class="hidden"><p class="muted">Sign in with the same email address that received this CTOD invitation.</p><input id="email" class="field" type="email" placeholder="Email"><input id="password" class="field" type="password" placeholder="Password"><button id="signin" class="btn">Sign In</button><div id="msg" class="muted"></div></div><div id="done" class="hidden"><h2 class="good">Access activated ✓</h2><p>Your CTOD company access has been accepted.</p><a href="/" class="btn" style="display:inline-block;text-decoration:none">Open CTOD</a></div></section></div><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2.112.2';const URL='https://wezcuprboyvbmlnuqdoi.supabase.co',KEY='sb_publishable_BFhSdHnbppOmw98ons8iSw_MtkOnRg5',sb=createClient(URL,KEY),$=s=>document.querySelector(s);const token=new URLSearchParams(location.search).get('token');async function accept(){if(!token){$('#status').textContent='Invitation token is missing.';return}const{data:{session}}=await sb.auth.getSession();if(!session){$('#status').textContent='Sign in to accept this invitation.';$('#login').classList.remove('hidden');return}$('#status').textContent='Activating access…';const{data,error}=await sb.rpc('accept_access_invite',{p_token:token});if(error){$('#status').textContent=error.message;return}$('#status').textContent='';$('#login').classList.add('hidden');$('#done').classList.remove('hidden')}$('#signin').onclick=async()=>{const{error}=await sb.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#password').value});if(error){$('#msg').textContent=error.message;return}await accept()};await accept();</script></body></html>
