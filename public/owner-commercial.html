<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CTOD Owner · Commercial Setup</title><style>:root{--n:#153f73;--b:#f4f7fb;--l:#dbe3ee;--m:#6b7280}*{box-sizing:border-box}body{margin:0;background:var(--b);font-family:Inter,system-ui,sans-serif;color:#172033}main{max-width:1100px;margin:auto;padding:24px}.card{background:white;border:1px solid var(--l);border-radius:18px;padding:20px;margin:16px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{width:100%;padding:11px;border:1px solid #cbd6e3;border-radius:10px;margin:5px 0}.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:800;cursor:pointer}.primary{background:var(--n);color:white}.secondary{background:#edf3f9;color:var(--n)}.muted{color:var(--m)}.hidden{display:none!important}.row{border-top:1px solid #edf1f5;padding:10px 0}.pill{background:#edf3f9;border-radius:999px;padding:4px 8px;font-size:12px;font-weight:800}@media(max-width:760px){.grid{grid-template-columns:1fr}}</style></head><body><main><h1>CTOD Platform Owner</h1><div class="muted">Commercial customer provisioning · CTOD 002 Sandbox</div><section id="auth" class="card"><h2>Owner Sign In</h2><input id="email" class="field" value="keaganelsberry@gmail.com"><input id="password" class="field" type="password" placeholder="Password"><button id="signin" class="btn primary">Sign In</button><div id="authMsg" class="muted"></div></section><section id="app" class="hidden"><div class="grid"><section class="card"><h2>Create Customer</h2><input id="name" class="field" placeholder="Company name"><input id="slug" class="field" placeholder="company-slug"><select id="template" class="field"></select><input id="ownerEmail" class="field" placeholder="Customer executive email (optional)"><input id="timezone" class="field" value="America/Boise"><div class="grid"><input id="plan" class="field" value="standard"><input id="trial" class="field" type="number" value="30"></div><button id="provision" class="btn primary">Provision Company Master</button><div id="createMsg" class="muted"></div></section><section class="card"><h2>Customers</h2><button id="refresh" class="btn secondary">Refresh</button><div id="customers"></div></section></div><section id="manage" class="card hidden"><h2 id="companyName"></h2><div id="companyMeta" class="muted"></div><div class="grid"><div><h3>Customer Sandbox</h3><input id="sandboxLabel" class="field" placeholder="Initial Setup"><button id="beginSandbox" class="btn secondary">Open / Create Sandbox</button><h3>Add / Update Location</h3><div class="grid"><input id="locCode" class="field" placeholder="Code"><input id="locName" class="field" placeholder="Location name"></div><div class="grid"><input id="locCity" class="field" placeholder="City"><input id="locState" class="field" placeholder="State"></div><input id="locMarket" class="field" placeholder="Market / district"><button id="saveLocation" class="btn primary">Save Location</button></div><div><h3>Add Role</h3><input id="roleTitle" class="field" placeholder="Role title"><button id="saveRole" class="btn primary">Add / Activate Role</button><h3>Add Question</h3><input id="section" class="field" value="Performance"><textarea id="question" class="field" rows="3" placeholder="Question text"></textarea><button id="saveQuestion" class="btn primary">Add to Sandbox</button><h3>Executive Access</h3><input id="inviteEmail" class="field" type="email" placeholder="executive@customer.com"><button id="invite" class="btn secondary">Create Executive Invite</button></div></div><div id="setupMsg" class="muted"></div></section></section></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2.112.2';const URL='https://zgwkjyezpgboysiklodj.supabase.co',KEY='sb_publishable_sWjR6yZoedl3q2vYzvRtRg_Pw1Jtuu7',sb=createClient(URL,KEY),$=s=>document.querySelector(s);let homeData=null,current=null;async function call(action,p={}){const{data:{session}}=await sb.auth.getSession();if(!session)throw new Error('Sign in required');const r=await fetch(URL+'/functions/v1/ctod-owner-deploy',{method:'POST',headers:{authorization:'Bearer '+session.access_token,apikey:KEY,'content-type':'application/json'},body:JSON.stringify({action,...p})});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'Owner service failed');return d}function esc(s){return String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}async function load(){homeData=await call('home');const t=homeData.dashboard.templates||[];$('#template').innerHTML='<option value="">Choose industry template</option>'+t.map(x=>'<option value="'+esc(x.template_code)+'" data-v="'+esc(x.version_code)+'">'+esc(x.name)+' · '+esc(x.version_code)+'</option>').join('');$('#customers').innerHTML=(homeData.dashboard.customers||[]).map(c=>'<div class="row"><b>'+esc(c.company_name)+'</b> <span class="pill">'+esc(c.account_status)+'</span><div class="muted">'+esc(c.template_name||c.template_code||'Custom')+' · '+esc(c.active_locations)+' locations · '+esc(c.active_roles)+' roles</div><button class="btn secondary manageBtn" data-id="'+c.company_id+'" data-name="'+esc(c.company_name)+'">Manage</button></div>').join('');document.querySelectorAll('.manageBtn').forEach(b=>b.onclick=()=>openCustomer(b.dataset.id,b.dataset.name))}async function openCustomer(id,name){current=await call('status',{company_id:id});$('#manage').classList.remove('hidden');$('#companyName').textContent=name;const c=current.configuration.company||{};$('#companyMeta').textContent=[c.industry_code,c.status,c.timezone].filter(Boolean).join(' · ')}$('#signin').onclick=async()=>{const{error}=await sb.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#password').value});if(error){$('#authMsg').textContent=error.message;return}$('#auth').classList.add('hidden');$('#app').classList.remove('hidden');load().catch(e=>$('#authMsg').textContent=e.message)};$('#refresh').onclick=load;$('#name').oninput=()=>{$('#slug').value=$('#name').value.toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')};$('#provision').onclick=async()=>{try{const o=$('#template').selectedOptions[0];if(!o?.value)throw new Error('Choose an industry template');const r=await call('provision_customer_v2',{name:$('#name').value.trim(),slug:$('#slug').value.trim(),template_code:o.value,template_version_code:o.dataset.v,owner_email:$('#ownerEmail').value.trim(),timezone:$('#timezone').value.trim(),plan_code:$('#plan').value.trim(),trial_days:Number($('#trial').value||0)});$('#createMsg').textContent='Provisioned '+$('#name').value+'.';await load();const id=r.customer?.company_id||r.customer?.id;if(id)await openCustomer(id,$('#name').value)}catch(e){$('#createMsg').textContent=e.message}};$('#beginSandbox').onclick=async()=>{try{await call('begin_customer_sandbox',{company_id:current.configuration.company.company_id,version_label:$('#sandboxLabel').value.trim()||'Initial Setup'});$('#setupMsg').textContent='Sandbox ready.';await openCustomer(current.configuration.company.company_id,$('#companyName').textContent)}catch(e){$('#setupMsg').textContent=e.message}};$('#saveLocation').onclick=async()=>{try{await call('mutate_customer_configuration',{company_id:current.configuration.company.company_id,operation:'upsert_location',configuration_payload:{location_code:$('#locCode').value.trim(),name:$('#locName').value.trim(),city:$('#locCity').value.trim(),state_code:$('#locState').value.trim(),market_name:$('#locMarket').value.trim()}});$('#setupMsg').textContent='Location saved.';await load()}catch(e){$('#setupMsg').textContent=e.message}};$('#saveRole').onclick=async()=>{try{await call('mutate_customer_configuration',{company_id:current.configuration.company.company_id,operation:'upsert_role',configuration_payload:{title:$('#roleTitle').value.trim()}});$('#setupMsg').textContent='Role saved.';await load()}catch(e){$('#setupMsg').textContent=e.message}};$('#saveQuestion').onclick=async()=>{try{await call('mutate_customer_configuration',{company_id:current.configuration.company.company_id,operation:'add_question',configuration_payload:{section_name:$('#section').value.trim()||'Performance',category:$('#section').value.trim()||'Performance',question_text:$('#question').value.trim()}});$('#setupMsg').textContent='Question added to sandbox.'}catch(e){$('#setupMsg').textContent=e.message}};$('#invite').onclick=async()=>{try{await call('create_customer_invite',{company_id:current.configuration.company.company_id,email:$('#inviteEmail').value.trim(),customer_role:'executive',location_ids:[]});$('#setupMsg').textContent='Executive invite created.'}catch(e){$('#setupMsg').textContent=e.message}};const{data:{session}}=await sb.auth.getSession();if(session){$('#auth').classList.add('hidden');$('#app').classList.remove('hidden');load().catch(()=>{})}</script></body></html>
