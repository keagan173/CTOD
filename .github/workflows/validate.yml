name: Validate CTOD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required files
        run: |
          test -f public/index.html
          test -f public/app.js
          test -f vercel.json
          test -f README.md

      - name: Validate JavaScript syntax
        run: node --check public/app.js

      - name: Validate JSON configuration
        run: |
          node -e "JSON.parse(require('fs').readFileSync('vercel.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"

      - name: Guard against committed secrets
        run: |
          if grep -R -n -E 're_[A-Za-z0-9_-]{20,}|sb_secret_|service_role' --exclude-dir=.git --exclude='*.zip' .; then
            echo 'Potential production secret detected in repository.'
            exit 1
          fi

      - name: Confirm Access Management is present in production source
        run: |
          grep -q 'Access Management' public/index.html
          grep -q 'sendInvite' public/app.js
