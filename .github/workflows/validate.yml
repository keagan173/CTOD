name: Validate CTOD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required files
        run: |
          test -f public/index.html
          test -f public/app.js
          test -f public/ctod-config.js
          test -f scripts/build.mjs
          test -f vercel.json
          test -f README.md

      - name: Validate JavaScript and environment neutrality
        run: npm run check

      - name: Validate JSON configuration
        run: |
          node -e "JSON.parse(require('fs').readFileSync('vercel.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('config/environments/production.public.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('config/environments/sandbox.public.json','utf8'))"

      - name: Guard against committed secrets
        run: |
          if grep -R -n -E \
            '(^|[^A-Za-z0-9_])re_[A-Za-z0-9_-]{20,}|(^|[^A-Za-z0-9_])sb_secret_[A-Za-z0-9_-]{20,}' \
            --exclude-dir=.git \
            --exclude='*.zip' \
            --exclude='validate.yml' \
            .; then
            echo 'Potential production secret detected in repository.'
            exit 1
          fi

      - name: Build production configuration
        run: |
          npm run build:production
          grep -q '"environment":"production"' dist/runtime-config.js
          grep -q 'wezcuprboyvbmlnuqdoi' dist/runtime-config.js

      - name: Prove sandbox build isolation guard
        env:
          CTOD_ENVIRONMENT: sandbox
          CTOD_APP_URL: https://ctod-sandbox-ci.example.invalid/
          CTOD_SUPABASE_URL: https://ctodsandboxci.supabase.co
          CTOD_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_only_not_a_secret
          CTOD_PRODUCTION_PROJECT_REF: wezcuprboyvbmlnuqdoi
          CTOD_SANDBOX_PROJECT_REF: ctodsandboxci
          CTOD_EMAIL_ALLOWLIST: approved-test@example.invalid
        run: |
          npm run build
          grep -q '"environment":"sandbox"' dist/runtime-config.js
          grep -q 'ctodsandboxci' dist/runtime-config.js
          if grep -q 'https://wezcuprboyvbmlnuqdoi.supabase.co' dist/runtime-config.js; then
            echo 'Sandbox build contains the production Supabase URL.'
            exit 1
          fi

      - name: Refuse sandbox build pointed at production
        env:
          CTOD_ENVIRONMENT: sandbox
          CTOD_APP_URL: https://ctod-sandbox-ci.example.invalid/
          CTOD_SUPABASE_URL: https://wezcuprboyvbmlnuqdoi.supabase.co
          CTOD_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_only_not_a_secret
          CTOD_PRODUCTION_PROJECT_REF: wezcuprboyvbmlnuqdoi
          CTOD_SANDBOX_PROJECT_REF: wezcuprboyvbmlnuqdoi
        run: |
          if npm run build; then
            echo 'Isolation guard accepted the production database.'
            exit 1
          fi

      - name: Refuse sandbox user bootstrap against production
        env:
          CTOD_SUPABASE_URL: https://wezcuprboyvbmlnuqdoi.supabase.co
          CTOD_SUPABASE_SECRET_KEY: test-only-not-a-real-secret
          CTOD_PRODUCTION_PROJECT_REF: wezcuprboyvbmlnuqdoi
          CTOD_SANDBOX_PROJECT_REF: zgwkjyezpgboysiklodj
          CTOD_SANDBOX_EMAIL: sandbox-master@ctod.test
          CTOD_SANDBOX_PASSWORD: test-only-password-12345
          CTOD_EMAIL_ALLOWLIST: sandbox-master@ctod.test
        run: |
          if npm run sandbox:bootstrap-user; then
            echo 'Sandbox bootstrap accepted the production project.'
            exit 1
          fi

      - name: Confirm Access Management is present in production source
        run: |
          grep -q 'Access Management' public/index.html
          grep -q 'sendInvite' public/app.js
